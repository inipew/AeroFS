name: P1 Permission Patch

on:
  push:
    branches:
      - fix/p1-archive-transfer-permissions
    paths:
      - .github/scripts/apply_p1_permission_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-archive-transfer-permissions
          fetch-depth: 0
      - name: Apply exact source patch
        run: python3 .github/scripts/apply_p1_permission_patch.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/transfer/engine.rs backend/src/filesystem/archive.rs
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(p1): harden archive and transfer permission commits"
          git push origin HEAD:fix/p1-archive-transfer-permissions
