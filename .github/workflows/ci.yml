name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: frontend
        run: bun run typecheck

      - name: Test frontend
        working-directory: frontend
        run: bun test

      - name: Build frontend assets
        working-directory: frontend
        run: bun run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      # Prepare lightweight stub so rust-embed compiles without running redundant frontend build
      - name: Prepare embedded frontend stub
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html><head><title>AeroFS</title></head><body><div id="app"></div></body></html>' > frontend/dist/index.html

      - name: Test backend
        working-directory: backend
        run: cargo test --locked

  contract:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Prepare lightweight stub so rust-embed compiles without running redundant frontend build
      - name: Prepare embedded frontend stub
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html><head><title>AeroFS</title></head><body><div id="app"></div></body></html>' > frontend/dist/index.html

      - name: Export OpenAPI schema
        working-directory: frontend
        run: bun run api:export

      - name: Generate frontend API types
        working-directory: frontend
        run: bun run api:generate

      - name: Verify committed API contract is current
        run: git diff --exit-code -- backend/openapi.json frontend/src/api/generated/openapi.ts
