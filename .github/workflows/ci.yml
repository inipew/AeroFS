name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  contract:
    name: Contract Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile
      - name: Verify OpenAPI contract parity
        run: |
          cd frontend
          bun run api:check

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo test
        run: |
          cd backend
          cargo test

  frontend-test:
    name: Frontend Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile
      - name: Typecheck
        run: |
          cd frontend
          bun run typecheck
      - name: Run tests
        run: |
          cd frontend
          bun test
