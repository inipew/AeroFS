name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: frontend
        run: bun run typecheck

      - name: Test frontend
        working-directory: frontend
        run: bun test

      - name: Build frontend assets
        working-directory: frontend
        run: bun run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The backend embeds ../frontend/dist at compile time via rust-embed.
      # Build the production frontend before compiling any backend target.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build embedded frontend assets
        working-directory: frontend
        run: bun run build

      - name: Test backend
        working-directory: backend
        run: cargo test --locked

  contract:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # api:export compiles the backend, which embeds frontend/dist.
      - name: Build embedded frontend assets
        working-directory: frontend
        run: bun run build

      - name: Export OpenAPI schema
        working-directory: frontend
        run: bun run api:export

      - name: Generate frontend API types
        working-directory: frontend
        run: bun run api:generate

      - name: Verify committed API contract is current
        run: git diff --exit-code -- backend/openapi.json frontend/src/api/generated/openapi.ts
