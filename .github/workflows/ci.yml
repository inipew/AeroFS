name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: frontend
        run: bun run typecheck

      - name: Test frontend
        working-directory: frontend
        run: bun test

      - name: Build frontend assets
        working-directory: frontend
        run: bun run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      - name: Install sccache
        run: |
          archive="${RUNNER_TEMP}/sccache-v0.17.0.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "67c4a96dd237c1f518f6b36083f270f9976d516f1e57fce891755ea782e50006  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/sccache-v0.17.0-x86_64-unknown-linux-musl/sccache" \
            "$HOME/.cargo/bin/sccache"
          sccache --version

      - name: Configure sccache
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('SCCACHE_GHA_ENABLED', 'on');
            core.exportVariable('RUSTC_WRAPPER', 'sccache');

      # Prepare lightweight stub so rust-embed compiles without running redundant frontend build
      - name: Prepare embedded frontend stub
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html><head><title>AeroFS</title></head><body><div id="app"></div></body></html>' > frontend/dist/index.html

      - name: Test backend
        working-directory: backend
        run: cargo test --locked

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  perf-harness:
    name: Perf Harness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile performance harness
        run: python3 -m py_compile tools/perf/aerofs_perf.py tools/perf/test_aerofs_perf.py

      - name: Test performance harness
        run: python3 -m unittest discover -s tools/perf -p 'test_*.py' -v

      - name: Smoke test idle-load-idle observer
        run: |
          output="${RUNNER_TEMP}/aerofs-perf-smoke"
          python3 tools/perf/aerofs_perf.py \
            --pid $$ \
            --no-metrics \
            --baseline-seconds 0.15 \
            --recovery-seconds 0.15 \
            --sample-interval 0.05 \
            --output-dir "$output" \
            --workload 'sleep 0.15'
          test -s "$output/samples.csv"
          test -s "$output/summary.json"

  contract:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Prepare lightweight stub so rust-embed compiles without running redundant frontend build
      - name: Prepare embedded frontend stub
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html><head><title>AeroFS</title></head><body><div id="app"></div></body></html>' > frontend/dist/index.html

      - name: Export OpenAPI schema
        working-directory: frontend
        run: bun run api:export

      - name: Generate frontend API types
        working-directory: frontend
        run: bun run api:generate

      - name: Verify committed API contract is current
        run: git diff --exit-code -- backend/openapi.json frontend/src/api/generated/openapi.ts
